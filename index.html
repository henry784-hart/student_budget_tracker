<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="auth-panel" class="auth-panel">
      <div class="auth-card">
        <h1>Student Budget Tracker</h1>
        <p id="auth-message" class="auth-message" role="status" aria-live="polite">Checking your session…</p>
        <form id="auth-form">
          <label for="auth-email">Email</label>
          <input id="auth-email" type="email" autocomplete="email" required>
          <label for="auth-password">Password</label>
          <input id="auth-password" type="password" autocomplete="current-password" minlength="8" required>
          <div class="auth-actions">
            <button id="login-btn" type="submit">Log in</button>
            <button id="register-btn" type="button">Create account</button>
          </div>
        </form>
      </div>
    </section>

    <div id="app-shell" class="hidden">
      <header class="app-header">
        <h1>Student Budget Tracker</h1>
        <div class="account-row"><span id="user-banner"></span><button id="logout-btn" type="button">Log out</button></div>
      </header>
      <p id="app-status" class="app-status" role="status" aria-live="polite"></p>

      <section id="summary">
        <div>Income: <span id="income">0</span></div>
        <div>Expenses: <span id="expenses">0</span></div>
        <div>Balance: <span id="balance">0</span></div>
      </section>

      <section id="monthly-summary">
        <h2>This month</h2>
        <p id="month-label" class="month-label"></p>
        <div class="monthly-cards">
          <div class="monthly-card income"><span class="label">Income</span><strong id="monthly-income">KES 0</strong></div>
          <div class="monthly-card expense"><span class="label">Expenses</span><strong id="monthly-expenses">KES 0</strong></div>
          <div class="monthly-card balance"><span class="label">Balance</span><strong id="monthly-balance">KES 0</strong></div>
        </div>
      </section>

      <section id="add-transaction">
        <h2>Add transaction</h2>
        <form id="transaction-form" novalidate>
          <input type="number" id="amount" placeholder="Amount (KES)" min="0.01" step="0.01" required>
          <select id="type"><option value="expense">Expense</option><option value="income">Income</option></select>
          <input type="text" id="category" list="category-list" placeholder="Category e.g. Food" required>
          <datalist id="category-list"></datalist>
          <input type="date" id="date" required>
          <input type="text" id="note" placeholder="Note (optional) e.g. lunch at campus">
          <button id="add-btn" type="submit">Add</button>
          <button id="cancel-btn" type="button" class="hidden">Cancel edit</button>
        </form>
      </section>

      <section id="breakdown"><h2>Spending by category</h2><ul id="breakdown-list"></ul></section>

      <section id="budget">
        <h2>Monthly budget</h2>
        <div id="budget-form">
          <input type="number" id="budget-input" placeholder="Monthly limit (KES)" min="0.01" step="0.01">
          <button id="budget-btn" type="button">Set limit</button>
        </div>
        <p id="budget-status">Loading budget…</p>
        <div class="bd-bar"><div id="budget-fill" class="bd-fill"></div></div>
      </section>

      <section id="transactions"><h2>Transactions</h2><ul id="list"></ul></section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
