<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Student Budget Tracker</h1>

    <section id="summary">
      <div>Income: <span id="income">0</span></div>
      <div>Expenses: <span id="expenses">0</span></div>
      <div>Balance: <span id="balance">0</span></div>
    </section>

    <section id="add-transaction">
      <h2>Add transaction</h2>
      <form id="transaction-form" novalidate>
        <input type="number" id="amount" placeholder="Amount (KES)" min="0.01" step="0.01" required>
        <select id="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
        <input type="text" id="category" list="category-list" placeholder="Category e.g. Food" required>
        <datalist id="category-list"></datalist>
        <input type="date" id="date" required>
        <input type="text" id="note" placeholder="Note (optional) e.g. lunch at campus">
        <button id="add-btn" type="submit">Add</button>
        <button id="cancel-btn" type="button" style="display: none">Cancel edit</button>
      </form>
    </section>

    <section id="breakdown">
      <h2>Spending by category</h2>
      <ul id="breakdown-list"></ul>
    </section>

    <section id="budget">
      <h2>Monthly budget</h2>
      <div id="budget-form">
        <input type="number" id="budget-input" placeholder="Monthly limit (KES)" min="0.01" step="0.01">
        <button id="budget-btn" type="button">Set limit</button>
      </div>
      <p id="budget-status">No limit set yet.</p>
      <div class="bd-bar"><div id="budget-fill" class="bd-fill"></div></div>
    </section>

    <section id="transactions">
      <h2>Transactions</h2>
      <ul id="list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
