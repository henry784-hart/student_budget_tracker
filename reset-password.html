<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a new password · Student Budget Tracker</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles/login.css">
</head>

<body class="login-page">
  <main class="auth-card">
    <h1>Choose a new password</h1>
    <p class="subtitle">The link works once and expires after one hour.</p>

    <p id="auth-message" class="auth-message"></p>

    <form id="reset-form" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
        <span class="hint">At least 8 characters. Use something you don't use anywhere else.</span>
      </div>

      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
      </div>

      <button id="submit-btn" class="submit-btn" type="submit">Save password</button>
    </form>

    <p class="auth-footer">
      <a href="login.html">Back to sign in</a>
    </p>
  </main>

  <script src="scripts/reset.js"></script>
</body>

</html>
